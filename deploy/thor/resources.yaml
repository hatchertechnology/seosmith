apiVersion: v1
kind: PersistentVolume
metadata:
  name: seosmith-state
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: zfs-local
  local:
    path: /hatch1/services/seosmith
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [thor]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seosmith-state
  namespace: htp-prod
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-local
  volumeName: seosmith-state
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seosmith
  namespace: htp-prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seosmith
  template:
    metadata:
      labels:
        app: seosmith
    spec:
      nodeSelector:
        kubernetes.io/hostname: thor
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Delay application startup until the sender policy is observed in effect.
      initContainers:
        - name: network-policy-gate
          image: docker.io/curlimages/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
          imagePullPolicy: Never
          command: [sh, -ec]
          args:
            - |
              sleep 10
              for attempt in 1 2 3; do
                public_status=$(curl -4 --noproxy '*' -sS -o /dev/null --max-time 10 -w '%{http_code}' https://htp-api-kerry-hatcher.fly.dev/ || true)
                [ "$public_status" = 200 ] || exit 1
                private_status=$(curl -4 --noproxy '*' -ksS -o /dev/null --max-time 3 -w '%{http_code}' https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}/ 2>/dev/null || true)
                [ "$private_status" = 000 ] || exit 1
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 32Mi
      containers:
        - name: seosmith
          # Both 4a (schema 2) and 4b (schema 4) run this binary; the report
          # contract is chosen by the environment below, not by the image.
          #
          # Release image built from SEOsmith main 1a0b8708a2453ca78de8602cdc0c2d6637523782
          # (archive sha256 36c994a9...2772), pinned by the manifest digest that
          # containerd recorded on import. tests/deploy_thor.rs refuses any
          # value that is not a full sha256 digest. The v2 image it replaces
          # (sha256:7073b6d33435d0a393dae26e6a25c34c4d2182f27870ef5372768d585a4822f1)
          # stays on the node as the 4a rollback candidate.
          image: localhost/seosmith@sha256:397ec34200c6b01c6acc9684ac9d78e0824b770d97008960dce3390a44a94532
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            # Step 4b: the schema-4 wire carries its own S01 evidence v1, so the
            # schema-2 evidence gate is off and must stay off alongside the
            # wire flag (the binary refuses both together at startup).
            - name: SEOSMITH_EVIDENCE_CONTRACT_V2
              value: "false"
            # Emit s14-wire-1 schema-4 reports with evidence v1.
            - name: SEOSMITH_POLICY_WIRE_V1
              value: "true"
            # Q1 production advisory policy: {} from
            # fixtures/policies/production-default.json via the seosmith-policy
            # ConfigMap generated in kustomization.yaml.
            - name: SEOSMITH_ADVISORY_POLICY
              value: /etc/seosmith/policy.json
            - name: SEOSMITH_API_TOKEN_FILE
              value: /secrets/api-token
            - name: HTP_INGEST_TOKEN_FILE
              value: /secrets/htp-token
            # Schema-4 route: HTP 422 and 409 are terminal here. The legacy
            # /audits route keeps retrying them, so do not fall back to it.
            - name: HTP_INGEST_URL
              value: https://htp-api-kerry-hatcher.fly.dev/integrations/seosmith/policy-audits
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: '2'
              memory: 1Gi
              ephemeral-storage: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: state
              mountPath: /data
            - name: policy
              mountPath: /etc/seosmith
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: seosmith-state
        - name: policy
          configMap:
            # kustomize rewrites this to the content-hashed name of the
            # seosmith-policy ConfigMap generated in kustomization.yaml.
            name: seosmith-policy
        - name: secrets
          secret:
            secretName: seosmith-credentials
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: seosmith
  namespace: htp-prod
spec:
  selector:
    app: seosmith
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seosmith
  namespace: htp-prod
spec:
  podSelector:
    matchLabels:
      app: seosmith
  policyTypes: [Ingress, Egress]
  ingress:
    # Label only the trusted private ingress namespace after verifying its identity.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/parent-resource: seosmith
              tailscale.com/parent-resource-ns: htp-prod
      ports:
        - port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 224.0.0.0/3
      ports:
        - port: 80
        - port: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seosmith
  namespace: htp-prod
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [seosmith]
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seosmith
                port:
                  number: 8080
