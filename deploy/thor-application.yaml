apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seosmith
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hatchertechnology/seosmith.git
    # Bootstrap must replace this with the exact reviewed merge SHA.
    targetRevision: main
    path: deploy/thor
  destination:
    server: https://kubernetes.default.svc
    namespace: htp-prod
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
