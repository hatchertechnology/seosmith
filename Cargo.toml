[package]
name = "seosmith"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Headless technical SEO audits with durable delivery to HTP"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
fs2 = "0.4"
ipnet = "2"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "brotli"] }
robotstxt = "0.3"
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
subtle = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Application modules expose internal APIs; rule tables intentionally stay together.
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
